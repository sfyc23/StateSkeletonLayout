# 版本目录：所有依赖版本固定声明，禁止动态版本。
[versions]
# 构建插件
agp = "8.13.2"
kotlin = "2.2.10"
# 运行环境
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
jvmTarget = "17"
# 库模块仅依赖 AndroidX Annotation（最少依赖原则）
androidx-annotation = "1.9.1"
# 示例模块依赖（不得反向进入库模块）
appcompat = "1.7.1"
material = "1.13.0"
recyclerview = "1.4.0"
constraintlayout = "2.2.1"
lifecycle = "2.9.2"
fragment = "1.8.9"
activity = "1.10.1"
lottie = "6.1.0"
svga = "2.6.1"
smartrefresh = "3.0.0-alpha"
epoxy = "5.2.1"
ksp = "2.2.10-2.0.2"
# Dokka 只用于生成发布制品的 API 文档（javadoc jar），不参与运行时代码。
# 2.1.0 对应 Kotlin 2.2.x；不与 kotlin 版本联动升级。
dokka = "2.1.0"
# 公开 API 兼容性基线：把 AAR 的公开签名导出为 api 文件，破坏性变更会显式失败。
binary-compatibility-validator = "0.18.2"
# 截图回归：跑在 Robolectric 上，不需要设备。骨架是纯视觉功能，
# 像素级正确性此前没有任何自动化覆盖。
roborazzi = "1.76.0"
coroutines = "1.10.2"
# 测试
junit = "4.13.2"
robolectric = "4.16.1"
test-runner = "1.7.0"
test-core = "1.7.0"
test-espresso = "3.7.0"
test-ext-junit = "1.3.0"

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
svga-player = { group = "com.github.yyued", name = "SVGAPlayer-Android", version.ref = "svga" }
smartrefresh-kernel = { group = "io.github.scwang90", name = "refresh-layout-kernel", version.ref = "smartrefresh" }
smartrefresh-header-classics = { group = "io.github.scwang90", name = "refresh-header-classics", version.ref = "smartrefresh" }
smartrefresh-footer-classics = { group = "io.github.scwang90", name = "refresh-footer-classics", version.ref = "smartrefresh" }
epoxy = { group = "com.airbnb.android", name = "epoxy", version.ref = "epoxy" }
epoxy-processor = { group = "com.airbnb.android", name = "epoxy-processor", version.ref = "epoxy" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
test-core = { group = "androidx.test", name = "core", version.ref = "test-core" }
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "test-espresso" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext-junit" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
agp-library = { id = "com.android.library", version.ref = "agp" }
agp-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compat = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
