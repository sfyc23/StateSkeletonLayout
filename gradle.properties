# 工程级 Gradle 配置
# 库发布版本与示例应用版本统一维护；Git 标签使用相同版本号。
libraryVersion=0.0.3

# 发布坐标：集中在此处，避免散落在各模块脚本里。
# 修改 group 时需同步 settings.gradle.kts 的 JitPack includeGroup 与 README 接入说明。
libraryGroup=com.github.sfyc23
# artifactId 与 Gradle 模块名（:stateskeletonlayout）大小写不同，是有意的公开制品名。
libraryArtifactId=StateSkeletonLayout
# 示例应用的 versionCode。与 libraryVersion 分开维护：versionCode 只能单调递增的整数，
# 而 libraryVersion 是语义化版本字符串，二者无法互相推导。发布时两者一起改。
sampleVersionCode=3

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Windows 下避免多个 Kotlin 守护进程争用同一份增量编译缓存。
# 由 Gradle 进程直接执行编译，可消除守护进程缓存注册冲突。
kotlin.compiler.execution.strategy=in-process

# KSP2 会把依赖类文件相对化；Windows 的 Gradle 缓存与项目跨盘时无法计算路径。
# 仅关闭 sample 注解处理的增量记录，保留 KSP2 和 Kotlin 的增量编译。
ksp.incremental=false
